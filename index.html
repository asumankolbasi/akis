<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Akış">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Akış — kelime kelime okuyucu</title>
<style>
  :root{
    --bg:#121212; --fg:#e9e6df; --muted:#8d8a84; --line:#2a2a2a; --card:#1b1b1b;
    --accent:#e0533d; --btn:#242424; --btnfg:#e9e6df; --hl:#3a2f1c;
    --fs:64px;
    --serif:"Iowan Old Style","Palatino","Georgia",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }
  body.sepya{ --bg:#f3ead8; --fg:#3b3226; --muted:#8a7d68; --line:#ddd0b6; --card:#ebe0ca; --btn:#e4d7bd; --btnfg:#3b3226; --accent:#c0392b; --hl:#f0d9a0; }
  body.acik{ --bg:#fbfbf9; --fg:#1d1d1d; --muted:#8b8b8b; --line:#e4e4e0; --card:#f1f1ed; --btn:#ececE8; --btnfg:#1d1d1d; --accent:#d23b26; --hl:#ffe9a8; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:var(--sans)}
  body{overscroll-behavior:none}
  button{font:inherit; color:var(--btnfg); background:var(--btn); border:0; border-radius:12px; padding:10px 14px; cursor:pointer; touch-action:manipulation}
  button:active{opacity:.7}
  .ghost{background:transparent}
  .hidden{display:none !important}

  /* ---------- Kütüphane ---------- */
  #library{max-width:860px; margin:0 auto; padding:28px 20px 60px}
  .libhead{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px}
  .libhead h1{font-family:var(--serif); font-weight:600; font-size:34px; margin:0; letter-spacing:.2px}
  .libhead h1 span{color:var(--accent)}
  .addbtn{background:var(--accent); color:#fff; font-weight:600; padding:12px 18px}
  #books{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:28px 20px}
  .book{cursor:pointer; position:relative; display:flex; flex-direction:column; gap:4px; min-width:0}
  .book .cover{aspect-ratio:2/3; border-radius:6px; overflow:hidden; background:var(--card); box-shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.18); margin-bottom:8px; position:relative}
  .book .cover img{width:100%; height:100%; object-fit:cover; display:block}
  .book .cover.ph{display:flex; flex-direction:column; justify-content:space-between; padding:16px 14px; background:linear-gradient(160deg,hsl(var(--h),28%,30%),hsl(var(--h),32%,18%)); color:#f3efe6}
  .book .cover.ph b{font-family:var(--serif); font-size:17px; line-height:1.25; font-weight:600; display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden}
  .book .cover.ph small{font-size:12px; opacity:.75}
  .book .t{font-family:var(--serif); font-size:15px; line-height:1.3; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .book .a{color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .book .meta{font-size:12px; color:var(--muted); display:flex; justify-content:space-between; gap:6px; margin-top:4px}
  .book .bar{height:3px; background:var(--line); border-radius:2px; overflow:hidden}
  .book .bar i{display:block; height:100%; background:var(--accent)}
  .book .del{position:absolute; top:6px; right:6px; z-index:1; width:28px; height:28px; padding:0; border-radius:50%; background:rgba(0,0,0,.45); color:#fff; font-size:16px; line-height:28px}
  .empty{color:var(--muted); text-align:center; padding:60px 20px; border:2px dashed var(--line); border-radius:18px; line-height:1.6}
  .empty b{color:var(--fg)}
  #status{margin:14px 0; color:var(--muted); font-size:14px; min-height:20px}
  .note{color:var(--muted); font-size:13px; margin-top:26px; line-height:1.5}

  /* ---------- Okuyucu ---------- */
  #reader{position:fixed; inset:0; display:flex; flex-direction:column}
  .topbar{display:flex; align-items:center; gap:8px; padding:12px 14px; transition:opacity .4s}
  .topbar .title{flex:1; min-width:0; text-align:center; font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .playing .topbar, .playing .bottom{opacity:.08}
  .playing #context{opacity:0; pointer-events:none}
  .playing .topbar:hover, .playing .bottom:hover{opacity:1}

  #stage{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:stretch; position:relative; user-select:none; -webkit-user-select:none; cursor:pointer; min-height:0}
  .guide{height:18px; position:relative; margin:0 auto; width:min(92vw,1100px)}
  .guide::before{content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--line)}
  .guide::after{content:""; position:absolute; left:50%; width:2px; height:100%; background:var(--line); transform:translateX(-1px)}
  .guide.top::after{top:0} .guide.bot::after{bottom:0}
  #word{display:grid; grid-template-columns:1fr auto 1fr; align-items:baseline; width:min(92vw,1100px); margin:0 auto; font-family:var(--serif); font-size:var(--fs); line-height:1.35; padding:.12em 0; white-space:pre}
  #word .l{text-align:right; overflow:hidden}
  #word .p{color:var(--accent)}
  #word .r{text-align:left; overflow:hidden}
  #word.sans{font-family:var(--sans)}
  #hint{position:absolute; bottom:18px; left:0; right:0; text-align:center; color:var(--muted); font-size:13px}

  #context{height:32vh; flex:none; overflow:auto; margin:0 auto; width:min(92vw,760px); padding:4px 4px 10px; font-family:var(--serif); font-size:18px; line-height:1.6; color:var(--muted); transition:opacity .4s}
  #context .w{cursor:pointer; border-radius:4px}
  #context .w.cur{background:var(--hl); color:var(--fg)}

  .bottom{padding:8px 16px 16px; transition:opacity .4s; padding-bottom:max(16px, env(safe-area-inset-bottom))}
  .progress{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); margin-bottom:10px}
  .progress input{flex:1}
  input[type=range]{-webkit-appearance:none; appearance:none; background:transparent; height:28px; margin:0; cursor:pointer; --p:0%}
  input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:2px; background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
  input[type=range]::-moz-range-track{height:4px; border-radius:2px; background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; margin-top:-6px; border-radius:50%; background:var(--fg); border:0}
  input[type=range]::-moz-range-thumb{width:16px; height:16px; border-radius:50%; background:var(--fg); border:0}
  .controls{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap}
  .controls .big{width:72px; height:72px; border-radius:50%; font-size:28px; background:var(--accent); color:#fff; display:grid; place-items:center; padding:0}
  .controls .nav{width:56px; height:56px; border-radius:50%; font-size:20px; display:grid; place-items:center; padding:0}
  .wpm{display:flex; align-items:center; gap:6px; background:var(--btn); border-radius:14px; padding:4px}
  .wpm button{padding:8px 12px; background:transparent; font-size:18px}
  .wpm b{min-width:74px; text-align:center; font-variant-numeric:tabular-nums; font-size:15px}
  .wpm small{color:var(--muted); font-weight:400}

  /* ---------- Paneller ---------- */
  .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:20}
  .sheet{background:var(--card); color:var(--fg); width:min(640px,100%); max-height:82vh; overflow:auto; border-radius:20px 20px 0 0; padding:18px 20px 28px}
  .sheet h2{margin:0 0 4px; font-size:18px; font-family:var(--serif)}
  .sheet h3{margin:22px 0 0; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .sheet .row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; border-bottom:1px solid var(--line)}
  .sheet .row label{font-size:15px}
  .sheet .row small{display:block; color:var(--muted); font-size:12px; margin-top:2px}
  .seg{display:flex; background:var(--btn); border-radius:12px; padding:3px}
  .seg button{background:transparent; padding:8px 12px; border-radius:10px; font-size:14px}
  .seg button.on{background:var(--accent); color:#fff}
  .switch{width:52px; height:30px; border-radius:15px; background:var(--line); position:relative; padding:0}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .2s}
  .switch.on{background:var(--accent)} .switch.on::after{left:25px}
  .chap{display:block; width:100%; text-align:left; background:transparent; border-bottom:1px solid var(--line); border-radius:0; padding:13px 4px; font-size:15px}
  .chap.cur{color:var(--accent); font-weight:600}
  .chap span{float:right; color:var(--muted); font-size:13px}
  .dialog{background:var(--card); border-radius:18px; padding:22px; width:min(380px,92vw); margin:auto; text-align:center}
  .dialog p{margin:0 0 18px; line-height:1.5}
  .dialog .acts{display:flex; gap:10px; justify-content:center}
  .danger{background:var(--accent); color:#fff}

  /* ---------- Klasik mod (sayfa sayfa) ---------- */
  #pageView{flex:1; display:flex; min-height:0; padding:6px 0 4px; position:relative}
  #pageViewport{overflow:hidden; margin:0 auto; height:100%; position:relative}
  #pageCols{height:100%; column-fill:auto; font-family:var(--serif); font-size:var(--pfs,20px); line-height:var(--plh,1.6); hyphens:auto; -webkit-hyphens:auto; text-align:justify}
  #pageCols.sans{font-family:var(--sans)}
  #pageCols p{margin:0 0 .2em; text-indent:1.4em}
  #pageCols p.first{text-indent:0}
  #pageCols h3{font-size:1.25em; text-align:center; margin:.6em 0 1.2em; font-weight:600; text-indent:0; break-after:avoid; hyphens:none; -webkit-hyphens:none}
  #pageCols .w.cur{background:var(--hl); border-radius:3px}
  .tapzone{position:absolute; top:0; bottom:0; width:30%; z-index:2}
  .tapzone.l{left:0} .tapzone.r{right:0}
  .pagectl{display:flex; align-items:center; justify-content:center; gap:14px}
  .pagectl b{font-weight:500; font-size:14px; color:var(--muted); min-width:120px; text-align:center; font-variant-numeric:tabular-nums}
  .modes{background:var(--btn)}
  .narrow{display:none}
  @media (max-width:640px){
    .topbar{gap:4px; padding:10px 8px}
    .topbar .title, .wide{display:none}
    .narrow{display:inline}
    .topbar > button{padding:8px 9px}
    .modes button{padding:7px 9px}
    .topbar .modes{margin-right:auto}
    #backBtn{margin-right:auto}
  }
  .modes button{padding:7px 12px; color:var(--muted)}
  .modes button.on{background:var(--bg); color:var(--fg); font-weight:600}

  /* ---------- Cümle modu ---------- */
  #sentView{flex:1; display:flex; min-height:0; position:relative}
  #sentBox{margin:auto; width:min(88vw,760px); max-height:100%; overflow:auto; padding:24px 0}
  #sentText{font-family:var(--serif); font-size:var(--sfs,30px); line-height:1.45; margin:0}
  #sentTr{font-family:var(--serif); font-size:calc(var(--sfs,30px) * .72); line-height:1.5; color:var(--muted); margin:1.1em 0 0; padding-top:1em; border-top:1px solid var(--line)}
  #sentTr.err{font-family:var(--sans); font-size:15px; cursor:pointer}
  #sentBox.sans #sentText, #sentBox.sans #sentTr{font-family:var(--sans)}
  .trbtn{border-radius:14px; padding:10px 16px; font-weight:600}
  .trbtn.on{background:var(--accent); color:#fff}
  .sheet input[type=password], .sheet input[type=text]{font:inherit; font-size:14px; color:var(--fg); background:var(--btn); border:1px solid var(--line); border-radius:10px; padding:9px 12px; width:240px}
  #fsBtn{display:grid; place-items:center; padding:9px 10px}
  body.chromeoff .page-mode .topbar, body.chromeoff .page-mode .bottom, body.chromeoff .sent-mode .topbar, body.chromeoff .sent-mode .bottom{opacity:0; pointer-events:none}
</style>
</head>
<body>

<!-- ====== Kütüphane ====== -->
<section id="library">
  <div class="libhead">
    <h1>Akış<span>.</span></h1>
    <button class="addbtn" id="addBtn">+ EPUB ekle</button>
    <input type="file" id="fileIn" multiple class="hidden">
  </div>
  <div id="status"></div>
  <div id="books"></div>
</section>

<!-- ====== Okuyucu ====== -->
<section id="reader" class="hidden">
  <div class="topbar">
    <button class="ghost" id="backBtn" title="Kitaplar">‹<span class="wide"> Kitaplar</span></button>
    <div class="title" id="rTitle"></div>
    <div class="seg modes" id="modeSeg"><button data-mode="flow">Akış</button><button data-mode="page">Klasik</button><button data-mode="sent">Cümle</button></div>
    <button class="ghost" id="chapBtn" title="Bölümler"><span class="wide">Bölümler</span><span class="narrow">☰</span></button>
    <button class="ghost hidden" id="fsBtn" title="Tam ekran (F)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ghost" id="setBtn">Aa</button>
  </div>

  <div id="stage">
    <div class="guide top"></div>
    <div id="word"><span class="l"></span><span class="p"></span><span class="r"></span></div>
    <div class="guide bot"></div>
    <div id="hint">Başlatmak/durdurmak için dokun</div>
  </div>

  <div id="context"></div>

  <div id="pageView" class="hidden">
    <div class="tapzone l" id="tapL"></div>
    <div id="pageViewport"><div id="pageCols"></div></div>
    <div class="tapzone r" id="tapR"></div>
  </div>

  <div id="sentView" class="hidden">
    <div class="tapzone l" id="sTapL"></div>
    <div id="sentBox"><p id="sentText"></p><p id="sentTr" class="hidden"></p></div>
    <div class="tapzone r" id="sTapR"></div>
  </div>

  <div class="bottom">
    <div class="progress">
      <span id="pChap"></span>
      <input type="range" id="scrub" min="0" max="1" value="0" step="1">
      <span id="pLeft"></span>
    </div>
    <div class="pagectl hidden" id="pageCtl">
      <button class="nav" id="pgPrev" style="width:56px;height:56px;border-radius:50%">‹</button>
      <b id="pgInfo"></b>
      <button class="nav" id="pgNext" style="width:56px;height:56px;border-radius:50%">›</button>
    </div>
    <div class="pagectl hidden" id="sentCtl">
      <button class="nav" id="sPrev" style="width:56px;height:56px;border-radius:50%" title="Önceki cümle">‹</button>
      <button class="trbtn" id="trBtn" title="Türkçe çeviri (T)">Çeviri</button>
      <button class="nav" id="sNext" style="width:56px;height:56px;border-radius:50%" title="Sonraki cümle">›</button>
    </div>
    <div class="controls" id="flowCtl">
      <button class="nav" id="prevBtn" title="Önceki cümle">⏮</button>
      <button class="big" id="playBtn">▶</button>
      <button class="nav" id="nextBtn" title="Sonraki cümle">⏭</button>
      <div class="wpm">
        <button id="slower">−</button>
        <b><span id="wpmVal">300</span> <small>k/dk</small></b>
        <button id="faster">+</button>
      </div>
    </div>
  </div>
</section>

<div id="overlay" class="sheet-bg hidden"></div>

<script>
"use strict";
/* =========================================================
   1. Küçük ZIP okuyucu (bağımlılık yok; DecompressionStream)
   ========================================================= */
async function readZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for(let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("Bu dosya geçerli bir EPUB/ZIP değil.");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder("utf-8");
  const entries = {};
  for(let n = 0; n < count; n++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const loff = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    entries[name] = {method, csize, loff};
    p += 46 + nlen + xlen + clen;
  }
  async function get(name){
    const e = entries[name];
    if(!e) return null;
    const lnl = dv.getUint16(e.loff + 26, true), lxl = dv.getUint16(e.loff + 28, true);
    const start = e.loff + 30 + lnl + lxl;
    const data = u8.subarray(start, start + e.csize);
    if(e.method === 0) return data;
    if(e.method !== 8) throw new Error("Desteklenmeyen sıkıştırma: " + e.method);
    const ds = new DecompressionStream("deflate-raw");
    const out = new Blob([data]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(out).arrayBuffer());
  }
  async function text(name){ const b = await get(name); return b ? dec.decode(b) : null; }
  return {entries, get, text};
}

/* =========================================================
   2. EPUB → kelime dizisi
   ========================================================= */
function resolvePath(base, rel){
  rel = rel.split("#")[0];
  try{ rel = decodeURIComponent(rel); }catch(e){}
  if(rel.startsWith("/")) return rel.slice(1);
  const parts = base.split("/"); parts.pop();
  for(const seg of rel.split("/")){
    if(seg === "..") parts.pop(); else if(seg !== "." && seg !== "") parts.push(seg);
  }
  return parts.join("/");
}
function parseXml(str, type){
  let doc = new DOMParser().parseFromString(str, type || "application/xml");
  if(doc.getElementsByTagName("parsererror").length) doc = new DOMParser().parseFromString(str, "text/html");
  return doc;
}
function byLocal(doc, name){ return Array.from(doc.getElementsByTagNameNS("*", name)); }

const BLOCK = new Set(["p","div","h1","h2","h3","h4","h5","h6","li","blockquote","section","article","tr","dd","dt","pre","figcaption","aside","header","footer","table","ul","ol","hr","td"]);
const SKIP = new Set(["script","style","head","title","svg","math","rt","rp"]);

function extractParagraphs(doc){
  const body = doc.body || doc.getElementsByTagName("body")[0] || doc.documentElement;
  const out = []; let cur = "";
  const flush = () => { const t = cur.replace(/\s+/g, " ").trim(); if(t) out.push(t); cur = ""; };
  (function walk(node){
    for(let c = node.firstChild; c; c = c.nextSibling){
      if(c.nodeType === 3){ cur += c.nodeValue; continue; }
      if(c.nodeType !== 1) continue;
      const tag = (c.localName || c.nodeName).toLowerCase();
      if(SKIP.has(tag)) continue;
      if(tag === "br"){ flush(); continue; }
      if(tag === "img"){ continue; }
      const blk = BLOCK.has(tag);
      if(blk) flush();
      walk(c);
      if(blk) flush();
    }
  })(body);
  flush();
  return out;
}

async function parseEpub(file){
  const zip = await readZip(await file.arrayBuffer());
  const container = await zip.text("META-INF/container.xml");
  if(!container) throw new Error("container.xml bulunamadı.");
  const rf = byLocal(parseXml(container), "rootfile")[0];
  const opfPath = rf && rf.getAttribute("full-path");
  if(!opfPath) throw new Error("OPF yolu bulunamadı.");
  const opfStr = await zip.text(opfPath);
  if(!opfStr) throw new Error("OPF okunamadı.");
  const opf = parseXml(opfStr);

  if(zip.entries["META-INF/encryption.xml"]){
    const enc = await zip.text("META-INF/encryption.xml");
    if(enc && /EncryptedData/i.test(enc) && !/font/i.test(enc.replace(/<[^>]*obfuscation[^>]*>/gi,""))) {
      throw new Error("Bu kitap DRM ile korunuyor, açılamıyor.");
    }
  }

  const title = (byLocal(opf, "title")[0] || {}).textContent || file.name.replace(/\.epub$/i, "");
  const author = (byLocal(opf, "creator")[0] || {}).textContent || "";
  const lang = ((byLocal(opf, "language")[0] || {}).textContent || "").trim();
  const manifest = {};
  let navHref = null, ncxHref = null;
  for(const it of byLocal(opf, "item")){
    const id = it.getAttribute("id"), href = it.getAttribute("href"), mt = it.getAttribute("media-type") || "";
    manifest[id] = {id, href: resolvePath(opfPath, href), mt, props: it.getAttribute("properties") || ""};
    if((it.getAttribute("properties") || "").split(/\s+/).includes("nav")) navHref = resolvePath(opfPath, href);
    if(mt === "application/x-dtbncx+xml") ncxHref = resolvePath(opfPath, href);
  }
  const spineEl = byLocal(opf, "spine")[0];
  if(!ncxHref && spineEl && spineEl.getAttribute("toc") && manifest[spineEl.getAttribute("toc")]) ncxHref = manifest[spineEl.getAttribute("toc")].href;
  const spine = byLocal(opf, "itemref").filter(r => r.getAttribute("linear") !== "no").map(r => manifest[r.getAttribute("idref")]).filter(Boolean);

  // İçindekiler → dosya başına başlık
  const tocTitle = {};
  try{
    if(navHref){
      const nav = parseXml(await zip.text(navHref), "application/xhtml+xml");
      const navs = byLocal(nav, "nav");
      const tocNav = navs.find(n => (n.getAttribute("epub:type") || n.getAttributeNS("http://www.idpf.org/2007/ops","type") || "").includes("toc")) || navs[0];
      if(tocNav) for(const a of byLocal(tocNav, "a")){
        const h = a.getAttribute("href"); if(!h) continue;
        const k = resolvePath(navHref, h);
        if(!tocTitle[k]) tocTitle[k] = a.textContent.replace(/\s+/g, " ").trim();
      }
    }
    if(!Object.keys(tocTitle).length && ncxHref){
      const ncx = parseXml(await zip.text(ncxHref));
      for(const np of byLocal(ncx, "navPoint")){
        const lbl = byLocal(np, "text")[0], ct = byLocal(np, "content")[0];
        if(!lbl || !ct) continue;
        const k = resolvePath(ncxHref, ct.getAttribute("src") || "");
        if(!tocTitle[k]) tocTitle[k] = lbl.textContent.replace(/\s+/g, " ").trim();
      }
    }
  }catch(e){ /* içindekiler isteğe bağlı */ }

  const words = []; const flags = []; const chapters = [];
  let n = 0;
  for(const item of spine){
    if(!/html|xml/i.test(item.mt) && !/\.x?html?$/i.test(item.href)) continue;
    const src = await zip.text(item.href); if(!src) continue;
    const doc = parseXml(src, "application/xhtml+xml");
    const paras = extractParagraphs(doc);
    const start = words.length;
    for(const para of paras){
      const ws = para.split(" ").filter(Boolean);
      for(const w of ws){ words.push(w); flags.push(0); }
      if(ws.length) flags[flags.length - 1] |= 1; // paragraf sonu
    }
    if(words.length === start) continue;
    n++;
    let t = tocTitle[item.href];
    if(!t){ const h = doc.querySelector && doc.querySelector("h1,h2,h3,title"); t = h ? h.textContent.replace(/\s+/g," ").trim() : ""; }
    if(!t || t.length > 80) t = (t ? t.slice(0, 60) + "…" : "Bölüm " + n);
    chapters.push({title: t, start});
  }
  if(!words.length) throw new Error("Kitapta okunabilir metin bulunamadı.");
  let cover = null;
  try{ cover = await findCover(zip, opf, opfPath, manifest, spine); }catch(e){ /* kapak isteğe bağlı */ }
  return {
    id: "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    title: title.trim(), author: author.trim(), lang, words, flags: new Uint8Array(flags), chapters, cover,
    added: Date.now()
  };
}

/* Kapak: EPUB3 cover-image → EPUB2 <meta name="cover"> → adında "cover" geçen görsel → ilk sayfadaki görsel */
async function findCover(zip, opf, opfPath, manifest, spine){
  const items = Object.values(manifest), isImg = it => it && /^image\//i.test(it.mt);
  let it = items.find(x => x.props.split(/\s+/).includes("cover-image"));
  if(!isImg(it)){ const m = byLocal(opf, "meta").find(x => x.getAttribute("name") === "cover"); it = m && manifest[m.getAttribute("content")]; }
  if(!isImg(it)) it = items.find(x => isImg(x) && /cover/i.test(x.id + " " + x.href));
  let href = isImg(it) ? it.href : null, mt = isImg(it) ? it.mt : "";
  if(!href && spine[0]){
    const doc = parseXml(await zip.text(spine[0].href) || "", "application/xhtml+xml");
    const im = byLocal(doc, "img")[0] || byLocal(doc, "image")[0];
    const src = im && (im.getAttribute("src") || im.getAttribute("xlink:href") || im.getAttributeNS("http://www.w3.org/1999/xlink", "href"));
    if(src){ href = resolvePath(spine[0].href, src); mt = (items.find(x => x.href === href) || {}).mt || ""; }
  }
  if(!href) return null;
  const bytes = await zip.get(href); if(!bytes) return null;
  const blob = await shrinkImage(new Blob([bytes], {type: mt || "image/jpeg"}), 400);
  // Blob yerine ham bayt sakla: WebKit IndexedDB'ye Blob yazarken sorun çıkarabiliyor
  return {type: blob.type || "image/jpeg", data: await blob.arrayBuffer()};
}
async function shrinkImage(blob, maxW){
  try{
    const bmp = await createImageBitmap(blob);
    const w = Math.min(maxW, bmp.width), h = Math.round(bmp.height * w / bmp.width);
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(bmp, 0, 0, w, h);
    const out = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85));
    return out || blob;
  }catch(e){ return blob; }
}

/* =========================================================
   3. Depolama (IndexedDB; yoksa yalnızca bellekte)
   ========================================================= */
const store = (() => {
  let dbp = null; const mem = {books:{}, pos:{}, kv:{}};
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res) => {
      try{
        const r = indexedDB.open("akis-okuyucu", 1);
        r.onupgradeneeded = () => {
          const db = r.result;
          db.createObjectStore("books", {keyPath:"id"});
          db.createObjectStore("pos"); db.createObjectStore("kv");
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      }catch(e){ res(null); }
    });
    return dbp;
  }
  async function tx(name, mode, fn){
    const db = await open();
    if(!db) return fn(null);
    return new Promise((res) => {
      try{
        const t = db.transaction(name, mode); const s = t.objectStore(name);
        const r = fn(s);
        t.oncomplete = () => res(r && "result" in r ? r.result : undefined);
        t.onerror = t.onabort = () => res(undefined);
      }catch(e){ res(undefined); }
    });
  }
  return {
    persistent: async () => !!(await open()),
    putBook: b => tx("books","readwrite", s => s ? s.put(b) : (mem.books[b.id] = b, null)),
    getBook: id => tx("books","readonly", s => s ? s.get(id) : {result: mem.books[id]}),
    delBook: id => tx("books","readwrite", s => s ? s.delete(id) : (delete mem.books[id], null)),
    allBooks: () => tx("books","readonly", s => s ? s.getAll() : {result: Object.values(mem.books)}),
    setPos: (id, v) => tx("pos","readwrite", s => s ? s.put(v, id) : (mem.pos[id] = v, null)),
    getPos: id => tx("pos","readonly", s => s ? s.get(id) : {result: mem.pos[id]}),
    delPos: id => tx("pos","readwrite", s => s ? s.delete(id) : (delete mem.pos[id], null)),
    allPos: async () => {
      const db = await open(); if(!db) return {...mem.pos};
      return new Promise(res => {
        const out = {}; try{
          const c = db.transaction("pos").objectStore("pos").openCursor();
          c.onsuccess = () => { const cur = c.result; if(cur){ out[cur.key] = cur.value; cur.continue(); } else res(out); };
          c.onerror = () => res(out);
        }catch(e){ res(out); }
      });
    },
    setKV: (k, v) => tx("kv","readwrite", s => s ? s.put(v, k) : (mem.kv[k] = v, null)),
    getKV: k => tx("kv","readonly", s => s ? s.get(k) : {result: mem.kv[k]}),
    delKVPrefix: p => tx("kv","readwrite", s => {
      if(s) return s.delete(IDBKeyRange.bound(p, p + "\uffff"));
      for(const k of Object.keys(mem.kv)) if(k.startsWith(p)) delete mem.kv[k];
      return null;
    }),
  };
})();

function fmtTime(min){

async function renderLibrary(){
  const books = (await store.allBooks()) || [];
  const pos = await store.allPos();
  books.sort((a, b) => ((pos[b.id]||{}).t || b.added) - ((pos[a.id]||{}).t || a.added));
  const box = $("#books");
  if(!books.length){
    box.style.display = "block";
    box.innerHTML = `<div class="empty"><b>Henüz kitap yok.</b><br>“+ EPUB ekle” ile Dosyalar'dan bir ya da birkaç EPUB seç.<br>Mac'teysen dosyayı bu sayfaya sürükleyip bırakabilirsin.</div>`;
    return;
  }
  box.style.display = "";
  coverUrls.forEach(u => URL.revokeObjectURL(u)); coverUrls = [];
  box.innerHTML = books.map(b => {
    const i = (pos[b.id] || {}).i || 0, total = b.words.length;
    const pct = Math.round(100 * i / Math.max(1, total - 1));
    const left = (total - i) / S.wpm;
    let cover;
    if(b.cover && b.cover.data){

    }

      <button class="del" data-del="${b.id}" title="Kaldır">×</button>
      ${cover}
      <div class="t">${esc(b.title)}</div>
      <div class="a">${esc(b.author)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="meta"><span>%${pct}</span><span>${fmtTime(left)} kaldı</span></div>
    </div>`;
  }).join("");
}

async function addFiles(files){

/* =========================================================
   6. Okuyucu (RSVP motoru)
   ========================================================= */
let B = null, idx = 0, timer = null, playing = false, rampLeft = 0, lastSave = 0, wakeLock = null;

async function openBook(id){
  B = await store.getBook(id);
  if(!B) return;
  if(!(B.flags instanceof Uint8Array)) B.flags = new Uint8Array(B.flags);
  const p = await store.getPos(id);
  idx = Math.min((p && p.i) || 0, B.words.length - 1);
  $("#library").classList.add("hidden"); $("#reader").classList.remove("hidden");
  $("#scrub").max = B.words.length - 1;
  setMode(S.mode);
}
function closeBook(){
  pause(); savePos(true); B = null;
  $("#reader").classList.add("hidden"); $("#library").classList.remove("hidden");
  renderLibrary();
}

function pivotIndex(w){
  const L = w.length;
  if(L <= 1) return 0; if(L <= 5) return 1; if(L <= 9) return 2; if(L <= 13) return 3; return 4;
}
function chunkAt(i){
  const n = Math.max(1, S.chunk); const ws = [];
  for(let k = 0; k < n && i + k < B.words.length; k++){
    ws.push(B.words[i + k]);
    if(B.flags[i + k] & 1) break;                      // paragraf sınırını aşma
    if(/[.!?…:;]["”’»)]*$/.test(B.words[i + k])) break; // cümle sınırını aşma
  }
  return ws;
}
function show(){
  if(!B) return;
  const ws = chunkAt(idx);
  const el = $("#word");
  let text = ws.join(" ");
  // Pivot: tek kelimede ORP; çoklu kelimede en uzun kelimenin ORP'si
  let pi;
  if(ws.length === 1){
    const lead = (text.match(/^[^\p{L}\p{N}]*/u) || [""])[0].length;
    const core = text.slice(lead).replace(/[^\p{L}\p{N}]+$/u, "");
    pi = lead + pivotIndex(core || text);
    if(pi >= text.length) pi = text.length - 1;
  } else {
    pi = Math.floor(text.length * 0.35);
  }
  const chars = Array.from(text);
  if(pi >= chars.length) pi = chars.length - 1;
  el.children[0].textContent = chars.slice(0, pi).join("");
  el.children[1].textContent = chars[pi] || "";
  el.children[2].textContent = chars.slice(pi + 1).join("");
  // Uzun kelimelerde yazıyı küçült ki taşmasın
  const maxSide = Math.max(pi, chars.length - pi - 1);
  const avail = (Math.min(window.innerWidth * 0.92, 1100) / 2) / (S.fs * 0.55);
  el.style.fontSize = maxSide > avail ? Math.max(18, Math.floor(S.fs * avail / maxSide)) + "px" : "";
  updateProgress();
}
function curChapter(){
  let c = 0;
  for(let k = 0; k < B.chapters.length; k++){ if(B.chapters[k].start <= idx) c = k; else break; }
  return c;
}
function fillRange(r){ const lo = +r.min || 0, hi = +r.max || 100; r.style.setProperty("--p", (100 * (r.value - lo) / Math.max(1, hi - lo)) + "%"); }
document.addEventListener("input", e => { if(e.target.type === "range") fillRange(e.target); });
function updateProgress(){
  const total = B.words.length;
  $("#scrub").value = idx; fillRange($("#scrub"));
  const c = curChapter();
  $("#pChap").textContent = `${c + 1}/${B.chapters.length}`;
  const pct = Math.round(100 * idx / Math.max(1, total - 1));
  const chEnd = c + 1 < B.chapters.length ? B.chapters[c + 1].start : total;
  if(S.mode === "sent"){
    $("#pLeft").textContent = `%${pct}`;
  } else if(S.mode === "page"){
    $("#pLeft").textContent = `%${pct}`;
    $("#pgInfo").textContent = PG.total ? `Sayfa ${PG.page + 1} / ${PG.total}` : "";
  } else {
    $("#pLeft").textContent = `%${pct} · bölüm: ${fmtTime((chEnd - idx) / S.wpm)} · kitap: ${fmtTime((total - idx) / S.wpm)}`;
  }
  $("#rTitle").textContent = `${B.title} — ${B.chapters[c].title}`;
}
function delayFor(i, n){
  const base = 60000 / S.wpm;
  let d = base * n * (n > 1 ? 0.9 : 1);
  const w = B.words[i + n - 1] || "";
  if(S.punct){
    if(/[.!?…]["”’»)]*$/.test(w)) d *= 2.2;
    else if(/[,;:–—]["”’»)]*$/.test(w)) d *= 1.5;
  }
  if(B.flags[i + n - 1] & 1) d += base * 1.6;          // paragraf sonu
  const L = w.length; if(L > 8) d *= 1 + Math.min(0.6, (L - 8) * 0.06);
  if(rampLeft > 0){ d *= 1 + rampLeft * 0.18; rampLeft--; }
  return d;
}
function tick(){
  if(!playing) return;
  const n = chunkAt(idx).length;
  const d = delayFor(idx, n);
  timer = setTimeout(() => {
    if(idx + n >= B.words.length){ show(); pause(); idx = B.words.length - 1; savePos(true); return; }
    const before = curChapter();
    idx += n; show();
    if(curChapter() !== before){ rampLeft = 4; }
    if(idx - lastSave > 40) savePos();
    tick();
  }, d);
}
function play(){
  if(!B || playing) return;
  if(idx >= B.words.length - 1) idx = 0;
  if(S.rewind && idx > 0) idx = sentenceStart(idx); // devam ederken cümle başına dön
  playing = true; rampLeft = S.ramp ? 5 : 0;
  document.body.classList.add("playing");
  $("#playBtn").textContent = "❚❚"; $("#hint").classList.add("hidden");
  show(); requestWake(); tick();
}
function pause(){
  playing = false; clearTimeout(timer);
  document.body.classList.remove("playing");
  $("#playBtn").textContent = "▶";
  releaseWake();
  if(B){ savePos(true); renderContext(); }
}
function toggle(){ playing ? pause() : play(); }

function endsSentence(i){ return (B.flags[i] & 1) || /[.!?…]["”’»)]*$/.test(B.words[i]); }
function sentenceStart(i){ let k = i - 1; while(k >= 0 && !endsSentence(k)) k--; return k + 1; }
function prevSentence(){
  let s = sentenceStart(idx);
  if(idx - s < 2 && s > 0) s = sentenceStart(s - 1);
  jump(s);
}
function nextSentence(){
  let k = idx; while(k < B.words.length - 1 && !endsSentence(k)) k++;
  jump(Math.min(B.words.length - 1, k + 1));
}
function jump(i){
  idx = Math.max(0, Math.min(B.words.length - 1, i));
  if(S.mode === "page"){ pageGoto(idx); savePos(true); return; }
  if(S.mode === "sent"){ showSentence(); savePos(true); return; }
  show();
  if(!playing) renderContext();
  else { clearTimeout(timer); rampLeft = S.ramp ? 3 : 0; tick(); }
}

function renderContext(){
  if(!B || S.mode !== "flow") return;
  // Mevcut paragrafı ve öncesini göster; kelimeye dokununca oraya atla
  let ps = idx - 1; while(ps >= 0 && !(B.flags[ps] & 1)) ps--; ps++;
  let pe = idx; while(pe < B.words.length - 1 && !(B.flags[pe] & 1)) pe++;
  let from = ps;
  if(ps > 0){ let k = ps - 2; while(k >= 0 && !(B.flags[k] & 1)) k--; from = Math.max(k + 1, ps - 120); }
  const to = Math.min(pe, from + 400);
  let html = "";
  for(let k = from; k <= to; k++){
    html += `<span class="w${k === idx ? " cur" : ""}" data-i="${k}">${esc(B.words[k])}</span>`;
    html += (B.flags[k] & 1) && k !== to ? "<br><br>" : " ";
  }
  const box = $("#context"); box.innerHTML = html;
  const cur = box.querySelector(".cur"); if(cur) cur.scrollIntoView({block:"center"});
}
$("#context").addEventListener("click", e => { const w = e.target.closest(".w"); if(w){ pause(); jump(+w.dataset.i); renderContext(); } });

function savePos(force){
  if(!B) return; lastSave = idx;
  store.setPos(B.id, {i: idx, t: Date.now()});
}

async function requestWake(){ try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} }
function releaseWake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
document.addEventListener("visibilitychange", () => { if(document.hidden && playing) pause(); else if(document.hidden) savePos(true); });

$("#stage").addEventListener("click", toggle);
$("#playBtn").onclick = toggle;
$("#prevBtn").onclick = prevSentence;
$("#nextBtn").onclick = nextSentence;
$("#backBtn").onclick = closeBook;
function setWpm(v){ S.wpm = Math.max(100, Math.min(1000, v)); $("#wpmVal").textContent = S.wpm; saveSettings(); if(B) updateProgress(); }
$("#slower").onclick = () => setWpm(S.wpm - 25);
$("#faster").onclick = () => setWpm(S.wpm + 25);
$("#scrub").addEventListener("input", e => {
  if(playing) pause(); idx = +e.target.value;
  if(S.mode === "flow") show(); else updateProgress();
});
$("#scrub").addEventListener("change", () => { if(S.mode === "page") pageGoto(idx); else if(S.mode === "sent") showSentence(); else renderContext(); savePos(true); });

/* =========================================================
   6b. Klasik mod (CSS sütunlarıyla sayfalama)
   ========================================================= */
const PG = {chap:-1, page:0, total:0, W:0, G:48, spans:[]};

function setMode(m){
  if(playing) pause();
  S.mode = m; saveSettings();
  const page = m === "page", sent = m === "sent", flow = !page && !sent;
  $("#reader").classList.toggle("page-mode", page);
  $("#reader").classList.toggle("sent-mode", sent);
  ["#stage", "#context", "#flowCtl"].forEach(s => $(s).classList.toggle("hidden", !flow));
  ["#pageView", "#pageCtl"].forEach(s => $(s).classList.toggle("hidden", !page));
  ["#sentView", "#sentCtl"].forEach(s => $(s).classList.toggle("hidden", !sent));
  document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  document.body.classList.remove("chromeoff");
  if(page){ PG.chap = -1; pageGoto(idx, true); }
  else if(sent){ showSentence(); }
  else { show(); renderContext(); }
}
$("#modeSeg").onclick = e => { const b = e.target.closest("[data-mode]"); if(b && b.dataset.mode !== S.mode) setMode(b.dataset.mode); };
function rerender(){ if(!B) return; if(S.mode === "page") relayoutPage(); else if(S.mode === "sent") showSentence(); else show(); }

function layoutPages(c){
  const vp = $("#pageViewport"), cols = $("#pageCols");
  const W = Math.min(Math.floor(window.innerWidth * 0.9), 720);
  vp.style.width = W + "px";
  PG.W = W; PG.chap = c;
  cols.style.columnWidth = W + "px";
  cols.style.columnGap = PG.G + "px";
  cols.style.transform = "translateX(0)";
  if(B.lang) cols.lang = B.lang; else cols.removeAttribute("lang");
  // bölümü paragraf paragraf yaz; her kelime bir span (konumu bulmak için)
  const s = B.chapters[c].start, e = c + 1 < B.chapters.length ? B.chapters[c + 1].start : B.words.length;
  // Kitabın ilk paragrafı zaten bölüm başlığıysa onu başlık olarak çiz, ayrıca ekleme
  let fe = s; while(fe < e - 1 && !(B.flags[fe] & 1)) fe++;
  const norm = t => t.toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
  const headIsText = fe - s < 25 && norm(B.words.slice(s, fe + 1).join(" ")) === norm(B.chapters[c].title);
  let html = headIsText ? `<h3>` : `<h3>${esc(B.chapters[c].title)}</h3><p class="first">`;
  for(let k = s; k < e; k++){
    html += `<span class="w" data-i="${k}">${esc(B.words[k])}</span>`;
    if(headIsText && k === fe){ html += k + 1 < e ? `</h3><p class="first">` : `</h3>`; continue; }
    if(B.flags[k] & 1){ html += k + 1 < e ? `</p><p>` : `</p>`; }
    else html += " ";
  }
  if(!(B.flags[e - 1] & 1)) html += "</p>";
  cols.innerHTML = html;
  PG.spans = Array.from(cols.querySelectorAll(".w"));
  const step = W + PG.G;
  PG.total = Math.max(1, Math.round((cols.scrollWidth + PG.G) / step));
  // Safari bazen scrollWidth'i eksik verir: son kelimenin konumundan da hesapla
  const last = PG.spans[PG.spans.length - 1];
  if(last) PG.total = Math.max(PG.total, pageOfSpan(last) + 1);
}
function pageOfSpan(span){
  const base = $("#pageCols").getBoundingClientRect();
  const r = span.getBoundingClientRect();
  return Math.max(0, Math.floor((r.left - base.left + 1) / (PG.W + PG.G)));
}
function firstWordOnPage(p){
  // kelimeler sırayla sayfalara dağıldığından ikili arama
  let lo = 0, hi = PG.spans.length - 1, ans = hi;
  while(lo <= hi){
    const mid = (lo + hi) >> 1;
    if(pageOfSpan(PG.spans[mid]) >= p){ ans = mid; hi = mid - 1; } else lo = mid + 1;
  }
  return PG.spans.length ? +PG.spans[ans].dataset.i : idx;
}
function showPage(p, keepIdx){
  PG.page = Math.max(0, Math.min(PG.total - 1, p));
  $("#pageCols").style.transform = `translateX(${-PG.page * (PG.W + PG.G)}px)`;
  if(!keepIdx) idx = firstWordOnPage(PG.page);
  updateProgress();
}
function pageGoto(i, mark){
  const c = (() => { let r = 0; for(let k = 0; k < B.chapters.length; k++){ if(B.chapters[k].start <= i) r = k; else break; } return r; })();
  if(c !== PG.chap) layoutPages(c);
  const span = $("#pageCols").querySelector(`[data-i="${i}"]`);
  $("#pageCols").querySelectorAll(".w.cur").forEach(x => x.classList.remove("cur"));
  if(span && mark && i > B.chapters[c].start) span.classList.add("cur");
  idx = i;
  showPage(span ? pageOfSpan(span) : 0, true);
}
function nextPage(){
  if(PG.page < PG.total - 1){ showPage(PG.page + 1); }
  else if(PG.chap + 1 < B.chapters.length){ layoutPages(PG.chap + 1); showPage(0); }
  savePos(true);
}
function prevPage(){
  if(PG.page > 0){ showPage(PG.page - 1); }
  else if(PG.chap > 0){ layoutPages(PG.chap - 1); showPage(PG.total - 1); }
  savePos(true);
}
$("#pgNext").onclick = nextPage; $("#pgPrev").onclick = prevPage;
$("#tapR").onclick = nextPage; $("#tapL").onclick = prevPage;
$("#pageViewport").addEventListener("click", () => document.body.classList.toggle("chromeoff"));
function addSwipe(el, next, prev){
  let x0 = null, y0 = 0;
  el.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  el.addEventListener("touchend", e => {
    if(x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)){ e.preventDefault(); dx < 0 ? next() : prev(); }
  });
}
addSwipe($("#pageView"), () => nextPage(), () => prevPage());
/* =========================================================
   6c. Cümle modu (cümle cümle okuma + isteğe bağlı Türkçe çeviri)
   ========================================================= */
const SENT_MAX = 80; // noktalaması olmayan çok uzun bölümleri parçala
function sentenceAt(i){
  let s = sentenceStart(i);
  if(i - s >= SENT_MAX) s = i;
  let e = s; while(e < B.words.length - 1 && e - s < SENT_MAX - 1 && !endsSentence(e)) e++;
  return [s, e];
}
function sentenceText(s, e){ return B.words.slice(s, e + 1).join(" "); }
function showSentence(){
  if(!B) return;
  const [s, e] = sentenceAt(idx);
  idx = s;
  $("#sentText").textContent = sentenceText(s, e);
  $("#sentBox").scrollTop = 0;
  updateProgress();
  renderTranslation(s, e);
}
function nextSentenceS(){ const [, e] = sentenceAt(idx); if(e < B.words.length - 1){ idx = e + 1; showSentence(); savePos(true); } }
function prevSentenceS(){ if(idx > 0){ idx = sentenceAt(idx - 1)[0]; showSentence(); savePos(true); } }
$("#sNext").onclick = nextSentenceS; $("#sPrev").onclick = prevSentenceS;
$("#sTapR").onclick = nextSentenceS; $("#sTapL").onclick = prevSentenceS;
$("#sentBox").addEventListener("click", e => { if(e.target.id !== "sentTr") document.body.classList.toggle("chromeoff"); });
addSwipe($("#sentView"), nextSentenceS, prevSentenceS);

function toggleTr(){ S.tr = !S.tr; saveSettings(); applySettings(); if(B && S.mode === "sent") showSentence(); }
$("#trBtn").onclick = toggleTr;
$("#sentTr").onclick = () => { if($("#sentTr").classList.contains("err")) showSentence(); };

const TR = {mem: new Map(), pending: new Map(), seq: 0, client: null, clientKey: ""};
function trKey(s, e){ return `tr:${B.id}:${S.trProv === "claude" ? S.trModel : "free"}:${s}:${e}`; }
async function getTranslation(s, e){
  const k = trKey(s, e);
  if(TR.mem.has(k)) return TR.mem.get(k);
  if(TR.pending.has(k)) return TR.pending.get(k);
  const job = (async () => {
    const saved = await store.getKV(k);
    if(typeof saved === "string") return saved;
    const prev = s > 0 ? (() => { const [ps, pe] = sentenceAt(s - 1); return sentenceText(ps, pe); })() : "";
    const out = S.trProv === "claude" ? await translateClaude(sentenceText(s, e), prev) : await translateFree(sentenceText(s, e));
    store.setKV(k, out);
    return out;
  })();
  TR.pending.set(k, job);
  try{ const out = await job; TR.mem.set(k, out); return out; }
  finally{ TR.pending.delete(k); }
}
async function renderTranslation(s, e){
  const el = $("#sentTr");
  const my = ++TR.seq;
  if(!S.tr){ el.classList.add("hidden"); return; }
  el.classList.remove("hidden", "err");
  if((B.lang || "").toLowerCase().startsWith("tr")){ el.textContent = "Bu kitap zaten Türkçe."; return; }
  const k = trKey(s, e);
  el.textContent = TR.mem.has(k) ? TR.mem.get(k) : "…";
  try{
    const t = await getTranslation(s, e);
    if(my !== TR.seq) return;
    el.textContent = t;
    // sıradaki cümleyi önceden çevir
    if(e < B.words.length - 1){ const [ns, ne] = sentenceAt(e + 1); getTranslation(ns, ne).catch(() => {}); }
  }catch(err){
    if(my !== TR.seq) return;
    el.classList.add("err");
    el.textContent = "Çeviri alınamadı: " + (err.message || err) + " Tekrar denemek için dokun.";
  }
}

/* Ücretsiz çeviri: MyMemory (anahtar gerekmez, günlük kotası sınırlı) */
async function translateFree(text){
  const src = ((B.lang || "en").split("-")[0] || "en").toLowerCase();
  const parts = []; let cur = "";
  for(const w of text.split(" ")){ if(cur && (cur + " " + w).length > 450){ parts.push(cur); cur = w; } else cur = cur ? cur + " " + w : w; }
  if(cur) parts.push(cur);
  const out = [];
  for(const q of parts){
    let r;
    try{ r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${src}|tr`); }
    catch(e){ throw new Error("İnternet bağlantısı yok."); }
    const j = await r.json().catch(() => null);
    if(!j || j.responseStatus !== 200 || !j.responseData) throw new Error(j && j.quotaFinished ? "Ücretsiz çevirinin günlük kotası doldu." : "Çeviri servisi yanıt vermedi.");
    out.push(j.responseData.translatedText);
  }
  return out.join(" ");
}

/* Claude ile çeviri: kullanıcının kendi API anahtarı, istek doğrudan tarayıcıdan Anthropic'e gider */
const SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.1.0/+esm";
const TR_SYSTEM = "Sen deneyimli bir edebi çevirmensin. Kullanıcının verdiği cümleyi doğal ve akıcı bir Türkçeye çevir. Yalnızca çeviriyi yaz: açıklama, not, tırnak ya da başlık ekleme. <onceki> etiketindeki cümle yalnızca bağlam içindir, onu çevirme. Cümle zaten Türkçeyse olduğu gibi yaz.";
async function translateClaude(text, prev){
  if(!S.trKey) throw new Error("Ayarlardan bir Claude API anahtarı gir.");
  let mod;
  try{ mod = await import(SDK_URL); }catch(e){ throw new Error("Claude kütüphanesi yüklenemedi; internet bağlantını kontrol et."); }
  const Anthropic = mod.default;
  if(!TR.client || TR.clientKey !== S.trKey){
    TR.client = new Anthropic({apiKey: S.trKey, dangerouslyAllowBrowser: true});
    TR.clientKey = S.trKey;
  }
  const req = {
    model: S.trModel,
    max_tokens: 4000,
    output_config: {effort: "low"},
    system: TR_SYSTEM,
    messages: [{role: "user", content: (prev ? `<onceki>${prev}</onceki>\n\n` : "") + `<cumle>${text}</cumle>`}],
  };
  let res;
  try{
    // Opus 5.5'te güvenlik reddine karşı sunucu tarafı yedek model
    res = S.trModel === "claude-opus-5-5"
      ? await TR.client.beta.messages.create({...req, betas: ["server-side-fallback-2026-07-01"], fallbacks: "default"})
      : await TR.client.messages.create(req);
  }catch(err){
    if(err instanceof Anthropic.AuthenticationError) throw new Error("API anahtarı geçersiz.");
    if(err instanceof Anthropic.PermissionDeniedError) throw new Error("Bu anahtarın bu modele erişimi yok.");
    if(err instanceof Anthropic.RateLimitError) throw new Error("Çok sık istek gönderildi, biraz bekle.");
    if(err instanceof Anthropic.APIConnectionError) throw new Error("İnternet bağlantısı yok.");
    if(err instanceof Anthropic.APIError) throw new Error(`Claude hatası (${err.status || "?"}).`);
    throw err;
  }
  if(res.stop_reason === "refusal") throw new Error("Claude bu cümleyi çevirmedi.");
  const out = res.content.filter(b => b.type === "text").map(b => b.text).join("").trim();
  if(!out) throw new Error("Boş yanıt geldi.");
  return out;
}

function relayoutPage(){ if(B && S.mode === "page"){ const keep = idx; PG.chap = -1; pageGoto(keep); } }

/* Tam ekran (tarayıcı destekliyorsa) */
const FS = {
  el: () => document.fullscreenElement || document.webkitFullscreenElement,
  can: () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled),
  toggle(){
    const d = document.documentElement;
    try{
      if(FS.el()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const r = (d.requestFullscreen || d.webkitRequestFullscreen).call(d); if(r && r.catch) r.catch(() => {}); }
    }catch(e){}
  },
  sync(){
    $("#fsBtn").innerHTML = FS.el()
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
    $("#fsBtn").title = FS.el() ? "Tam ekrandan çık (F)" : "Tam ekran (F)";
  }
};
$("#fsBtn").classList.toggle("hidden", !FS.can());
$("#fsBtn").onclick = FS.toggle;
document.addEventListener("fullscreenchange", FS.sync);
document.addEventListener("webkitfullscreenchange", FS.sync);

document.addEventListener("keydown", e => {
  if(!B || !$("#overlay").classList.contains("hidden")) return;
  if((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && FS.can()){ e.preventDefault(); FS.toggle(); return; }
  if(S.mode === "sent"){
    if(e.key === "ArrowRight" || e.key === " " || e.key === "PageDown"){ e.preventDefault(); nextSentenceS(); }
    else if(e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); prevSentenceS(); }
    else if(e.key === "t" || e.key === "T"){ e.preventDefault(); toggleTr(); }
    else if(e.key === "Escape") closeBook();
    return;
  }
  if(S.mode === "page"){
    if(e.key === "ArrowRight" || e.key === " " || e.key === "PageDown"){ e.preventDefault(); nextPage(); }
    else if(e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); prevPage(); }
    else if(e.key === "Escape") closeBook();
    return;
  }
  if(e.key === " "){ e.preventDefault(); toggle(); }
  else if(e.key === "ArrowLeft") prevSentence();
  else if(e.key === "ArrowRight") nextSentence();
  else if(e.key === "ArrowUp"){ e.preventDefault(); setWpm(S.wpm + 25); }
  else if(e.key === "ArrowDown"){ e.preventDefault(); setWpm(S.wpm - 25); }
  else if(e.key === "Escape") closeBook();
});
let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(rerender, 150); });

/* =========================================================
   7. Paneller: bölümler, ayarlar, onay
   ========================================================= */
function openSheet(html, onClick){
  const ov = $("#overlay");
  ov.innerHTML = `<div class="sheet">${html}</div>`;
  ov.classList.remove("hidden");
  ov.onclick = e => { if(e.target === ov){ closeSheet(); return; } onClick && onClick(e); };
}
function closeSheet(){ $("#overlay").classList.add("hidden"); $("#overlay").innerHTML = ""; }

$("#chapBtn").onclick = () => {
  pause();
  const c = curChapter();
  const html = `<h2>Bölümler</h2>` + B.chapters.map((ch, k) => {
    const end = k + 1 < B.chapters.length ? B.chapters[k + 1].start : B.words.length;
    return `<button class="chap${k === c ? " cur" : ""}" data-k="${k}">${esc(ch.title)}<span>${fmtTime((end - ch.start) / S.wpm)}</span></button>`;
  }).join("");
  openSheet(html, e => { const b = e.target.closest(".chap"); if(b){ closeSheet(); jump(B.chapters[+b.dataset.k].start); renderContext(); savePos(true); } });
  const cur = $("#overlay .chap.cur"); if(cur) cur.scrollIntoView({block:"center"});
};

function settingsHtml(){
  const seg = (key, opts) => `<div class="seg">${opts.map(([v, l]) => `<button data-set="${key}" data-v="${v}" class="${String(S[key]) === String(v) ? "on" : ""}">${l}</button>`).join("")}</div>`;
  const sw = key => `<button class="switch${S[key] ? " on" : ""}" data-toggle="${key}"></button>`;
  const range = (key, min, max, step) => `<div style="display:flex;align-items:center;gap:10px"><input type="range" min="${min}" max="${max}" step="${step}" value="${S[key]}" data-range="${key}" style="width:160px"><b style="min-width:42px">${S[key]}</b></div>`;
  return `<h2>Ayarlar</h2>
  <h3>Genel</h3>
  <div class="row"><label>Tema</label>${seg("theme", [["koyu","Koyu"],["sepya","Sepya"],["acik","Açık"]])}</div>
  <div class="row"><label>Yazı tipi</label>${seg("font", [["serif","Tırnaklı"],["sans","Düz"]])}</div>
  <h3>Akış</h3>
  <div class="row"><label>Hız<small>Dakikadaki kelime</small></label>${range("wpm", 100, 1000, 25)}</div>
  <div class="row"><label>Aynı anda<small>Ekranda gösterilen kelime sayısı</small></label>${seg("chunk", [[1,"1"],[2,"2"],[3,"3"]])}</div>
  <div class="row"><label>Yazı boyutu</label>${range("fs", 28, 120, 2)}</div>
  <div class="row"><label>Noktalamada dur<small>Cümle ve virgül sonlarında kısa bekleme</small></label>${sw("punct")}</div>
  <div class="row"><label>Yumuşak başlangıç<small>Başlatınca ilk kelimeler biraz yavaş</small></label>${sw("ramp")}</div>
  <div class="row"><label>Cümle başından devam<small>Durdurup başlatınca cümlenin başına döner</small></label>${sw("rewind")}</div>
  <p class="note" style="margin-top:10px">Kısayollar: boşluk = başlat/durdur, ← → = cümle, ↑ ↓ = hız, F = tam ekran.</p>
  <h3>Klasik</h3>
  <div class="row"><label>Yazı boyutu</label>${range("pfs", 14, 36, 1)}</div>
  <div class="row"><label>Satır aralığı</label>${seg("plh", [[1.4,"Sık"],[1.6,"Normal"],[1.9,"Geniş"]])}</div>
  <p class="note" style="margin-top:10px">Kısayollar: ← → ya da boşluk = sayfa çevir, F = tam ekran.</p>
  <h3>Cümle</h3>
  <div class="row"><label>Yazı boyutu</label>${range("sfs", 20, 48, 1)}</div>
  <div class="row"><label>Çeviri servisi<small>${S.trProv === "claude" ? "Daha iyi çeviri, kendi API anahtarınla ücretli" : "Anahtar gerekmez, günlük kotası sınırlı"}</small></label>${seg("trProv", [["free","Ücretsiz"],["claude","Claude"]])}</div>
  ${S.trProv === "claude" ? `
  <div class="row"><label>Model</label>${seg("trModel", [["claude-opus-5-5","Opus 5.5"],["claude-haiku-5-5","Haiku 5.5"]])}</div>
  <div class="row"><label>API anahtarı<small>Yalnızca bu tarayıcıda saklanır</small></label><input type="password" data-text="trKey" value="${esc(S.trKey)}" placeholder="sk-ant-…" autocomplete="off" spellcheck="false"></div>` : ""}
  <p class="note" style="margin-top:10px">Kısayollar: ← → ya da boşluk = cümle, T = çeviri, F = tam ekran.</p>`;
}
function refreshSettings(){ $("#overlay .sheet").innerHTML = settingsHtml(); bindRanges(); }
function bindRanges(){
  document.querySelectorAll("#overlay input[type=range]").forEach(fillRange);
  document.querySelectorAll("#overlay [data-text]").forEach(i => i.onchange = () => {
    S[i.dataset.text] = i.value.trim(); saveSettings(); if(B && S.mode === "sent") showSentence();
  });
  document.querySelectorAll("#overlay [data-range]").forEach(r => r.oninput = () => {
    const k = r.dataset.range; S[k] = +r.value; r.nextElementSibling.textContent = r.value;
    applySettings(); saveSettings(); rerender();
  });
}
$("#setBtn").onclick = () => {
  pause();
  openSheet(settingsHtml(), e => {
    const s = e.target.closest("[data-set]"), t = e.target.closest("[data-toggle]");
    if(s){ const k = s.dataset.set; S[k] = isNaN(+s.dataset.v) ? s.dataset.v : +s.dataset.v; }
    else if(t){ S[t.dataset.toggle] = !S[t.dataset.toggle]; }
    else return;
    applySettings(); saveSettings(); rerender(); refreshSettings();
  });
  bindRanges();
};

function confirmDialog(msg, okLabel, onOk){
  const ov = $("#overlay");
  ov.innerHTML = `<div class="dialog"><p>${esc(msg)}</p><div class="acts"><button data-a="no">Vazgeç</button><button class="danger" data-a="ok">${esc(okLabel)}</button></div></div>`;
  ov.style.alignItems = "center"; ov.classList.remove("hidden");
  ov.onclick = e => {
    const a = e.target.closest("[data-a]");
    if(e.target === ov || a){ ov.classList.add("hidden"); ov.style.alignItems = ""; ov.innerHTML = ""; if(a && a.dataset.a === "ok") onOk(); }
  };
}
